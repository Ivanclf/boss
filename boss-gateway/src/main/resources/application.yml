server:
  port: 30000
spring:
  application:
    name: boss-gateway
  profiles:
    active: dev
  data:
    redis:
      host: ${spring.data.redis.host}
      port: ${spring.data.redis.port}
      password: ${spring.data.redis.password}
      database: ${spring.data.redis.database}
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  cloud:
    nacos:
      server-addr: ${spring.cloud.nacos.server-addr}
    gateway:
      server:
        webflux:
          routes:
            - id: boss-user-service
              uri: lb://boss-user-service
              predicates:
                - Path=/user/**

            - id: boss-job-service
              uri: lb://boss-job-service
              predicates:
                - Path=/jobs/**

            - id: boss-chat-service
              uri: lb://boss-chat-service
              predicates:
                - Path=/chat/**

            - id: boss-ai-service
              uri: lb://boss-ai-service
              predicates:
                - Path=/ai/**

            - id: boss-search-service
              uri: lb://boss-search-service
              predicates:
                - Path=/search/**

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.web.reactive.error.ErrorWebFluxAutoConfiguration
      - org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration